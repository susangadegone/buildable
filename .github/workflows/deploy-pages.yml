name: Deploy Buildable to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the static site
        env:
          GH_PAGES_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: bunx vite build

      - name: Collect the static files
        run: |
          if [ -f .output/public/index.html ] || [ -f .output/public/_shell.html ]; then
            SRC=.output/public
          elif [ -f dist/client/index.html ] || [ -f dist/client/_shell.html ]; then
            SRC=dist/client
          else
            echo "::error::No index.html found in .output/public or dist/client after the build."
            ls -la .output/public dist/client 2>/dev/null || true
            exit 1
          fi
          cp -r "$SRC" gh-pages-site
          [ -f gh-pages-site/index.html ] || cp gh-pages-site/_shell.html gh-pages-site/index.html
          cp gh-pages-site/index.html gh-pages-site/404.html
          echo "Deploying files from $SRC"

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
